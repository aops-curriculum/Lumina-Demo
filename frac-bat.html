<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fraction Battle (FracBat)</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f4f6fa;
      min-height: 100vh;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08), 0 1.5px 4px rgba(0, 0, 0, 0.04);
    }

    h2 {
      text-align: center;
      color: #333;
      margin: 0 0 16px;
      font-size: 24px;
      font-weight: 600;
    }

    .controls {
      display: flex;
      justify-content: center;
      margin-bottom: 16px;
    }

    button {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      background: #007bff;
      color: white;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    button:hover {
      background: #0056b3;
    }

    #game-container {
      display: flex;
      justify-content: center;
    }

    canvas {
      display: block;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Fraction Bat</h2>
    <div class="controls">
      <button id="resetBtn" type="button">Reset</button>
    </div>
    <div id="game-container"></div>
  </div>
  <script src="frac-bat.js"></script>
</body>
</html>
