<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Problem–Answer Match-Up</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f4f6fa;
      min-height: 100vh;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
      background: white;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08), 0 1.5px 4px rgba(0, 0, 0, 0.04);
    }

    h2 {
      text-align: center;
      color: #157e97;
      margin: 0 0 8px;
      font-size: 24px;
      font-weight: 700;
    }

    .instructions {
      text-align: center;
      color: #454545;
      font-size: 14px;
      line-height: 1.4;
      margin: 0 0 16px;
    }

    .columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 12px;
    }

    label.field-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #295d80;
    }

    textarea {
      box-sizing: border-box;
      width: 100%;
      resize: vertical;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #9cdbe1;
      font-family: inherit;
      font-size: 13px;
      line-height: 1.4;
      color: #171717;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    button {
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid #9cdbe1;
      background: #ffffff;
      color: #171717;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    button.primary {
      border: none;
      background: #157e97;
      color: #ffffff;
    }

    button:hover {
      filter: brightness(0.96);
    }

    .key-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      cursor: pointer;
    }

    #error {
      min-height: 18px;
      margin: 0 0 12px;
      font-size: 13px;
      color: #ad0000;
    }

    #game-container {
      display: flex;
      justify-content: center;
    }

    canvas {
      display: block;
      border: 1px solid #c9ecf0;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Problem–Answer Match-Up</h2>
    <p class="instructions">
      Enter student names and all 16 answers. Each student receives a problem number
      and an answer from a different problem.
    </p>

    <div class="columns">
      <div>
        <label class="field-label" for="names-input">Student names or initials (one per line)</label>
        <textarea id="names-input" rows="5"></textarea>
      </div>
      <div>
        <label class="field-label" for="answers-input">Answers for problems 1–16 (one per line)</label>
        <textarea id="answers-input" rows="5"></textarea>
      </div>
    </div>

    <p id="error"></p>

    <div class="actions">
      <button id="generate-btn" class="primary" type="button">Generate Assignments</button>
      <label class="key-toggle">
        <input id="show-key" type="checkbox" />
        Show answer key
      </label>
      <button id="reset-btn" type="button">Reset</button>
    </div>

    <div id="game-container"></div>
  </div>
  <script src="problem-answer-match-up.js"></script>
</body>
</html>
