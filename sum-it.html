<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sum-It!</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f4f6fa;
      min-height: 100vh;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08), 0 1.5px 4px rgba(0, 0, 0, 0.04);
    }

    h2 {
      text-align: center;
      color: #333;
      margin: 0 0 16px;
      font-size: 24px;
      font-weight: 600;
    }

    #game-container {
      display: flex;
      justify-content: center;
    }

    #game-stage {
      position: relative;
      width: 720px;
      height: 480px;
    }

    #instructions-panel {
      position: absolute;
      display: none;
      overflow-y: auto;
      box-sizing: border-box;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.97);
      border: 2px solid rgb(41, 93, 128);
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.45;
      color: #1e1e1e;
      text-align: left;
      white-space: pre-wrap;
      z-index: 2;
      scrollbar-width: thin;
      scrollbar-color: rgb(41, 93, 128) #e8eef3;
    }

    #instructions-panel::-webkit-scrollbar {
      width: 8px;
    }

    #instructions-panel::-webkit-scrollbar-track {
      background: #e8eef3;
      border-radius: 4px;
    }

    #instructions-panel::-webkit-scrollbar-thumb {
      background: rgb(41, 93, 128);
      border-radius: 4px;
    }

    canvas {
      display: block;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      cursor: default;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Sum-It!</h2>
    <div id="game-container">
      <div id="game-stage">
        <div id="instructions-panel" aria-hidden="true"></div>
      </div>
    </div>
  </div>
  <script src="sum-it.js"></script>
</body>
</html>
